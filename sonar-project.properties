sonar.projectKey=fusionaxi-js-runtime-images
sonar.projectName=FusionAxi JavaScript Runtime Images
sonar.projectDescription=Bun tooling and container images pairing Bun with Node.js or Deno.
sonar.sourceEncoding=UTF-8

# Project links shown in SonarQube.
sonar.links.homepage=https://github.com/fusionaxi/js-runtime-images#readme
sonar.links.scm=https://github.com/fusionaxi/js-runtime-images
sonar.links.ci=https://github.com/fusionaxi/js-runtime-images/actions
sonar.links.issue=https://github.com/fusionaxi/js-runtime-images/issues

# Include TypeScript tooling, Dockerfiles, examples, and GitHub Actions.
# Test helpers belong to the test scope alongside unit and container tests.
sonar.sources=.
sonar.tests=tests/unit,tests/images

# Exclude tests (including container fixtures) from the main source scope,
# along with dependencies, generated output, local configuration, and secrets.
sonar.exclusions=\
  tests/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/.artifacts/**,\
  **/.scannerwork/**,\
  **/dist/**,\
  **/.idea/**,\
  **/.env,**/.env.*,\
  **/*.pem,**/*.key,**/*.p12,**/*.pfx

# Use the same TypeScript project as bun run typecheck.
sonar.typescript.tsconfigPaths=tsconfig.json

# Generated by bun run test:coverage before scanning.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep examples, ambient types, and lint configuration analyzable without
# treating them as executable tooling that needs unit-test coverage.
sonar.coverage.exclusions=examples/**,**/*.d.ts,eslint.config.js

# Supply SONAR_HOST_URL and SONAR_TOKEN through the environment.
# Run bun run sonar:scan to generate coverage and upload the analysis.
