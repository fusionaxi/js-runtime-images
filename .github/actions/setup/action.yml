name: Set up Bun tooling
description: Install the pinned Bun runtime and locked development dependencies
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@635640504f6d7197d3bb29876a652f671028dc97
      with:
        bun-version-file: .bun-version
    - run: bun install --frozen-lockfile --ignore-scripts
      shell: bash
