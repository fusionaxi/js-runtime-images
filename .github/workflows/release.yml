name: Release images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild existing versions to refresh base images and OS packages
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Serialize releases so an older run cannot replace newer floating tags.
concurrency:
  group: publish-js-runtime-images
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run check
      - name: Plan all supported Node.js majors with @nodevu/core and stable Deno
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan=$(bun src/cli.ts matrix --output .artifacts/plan.json)
          echo "matrix=$plan" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-build-plan
          path: .artifacts/plan.json
          include-hidden-files: true
          if-no-files-found: error

  build:
    name: Publish ${{ matrix.id }} (${{ join(matrix.platforms, ', ') }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_PLATFORMS: ${{ join(matrix.platforms, ',') }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: release-build-plan
          path: .artifacts
      # Keep both architectures under the same digest for the smoke tests.
      - name: Enable the containerd image store
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: ./.github/actions/container-engine
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build missing or changed images, or reuse the published digest
        env:
          BUILD_ID: ${{ matrix.id }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          args=()
          if [ "$FORCE_REBUILD" = true ]; then args+=(--force-rebuild); fi
          bun run images release --plan .artifacts/plan.json --id "$BUILD_ID" \
            --metadata ".artifacts/results/$BUILD_ID.json" "${args[@]}"
      - name: Smoke test the published digest on every configured platform
        env:
          BUILD_ID: ${{ matrix.id }}
          IMAGE: ${{ matrix.image }}
          TEST_RUNTIME: ${{ matrix.runtime }}
          TEST_VARIANT: ${{ matrix.variant }}
          TEST_PLATFORMS: ${{ env.BUILD_PLATFORMS }}
          EXPECTED_BUN: ${{ matrix.bunVersion }}
          EXPECTED_RUNTIME: ${{ matrix.runtimeVersion }}
        run: |
          TEST_IMAGE=$(bun -e 'import { metadataDigest } from "./src/docker.ts"; const data = await Bun.file(`.artifacts/results/${Bun.env.BUILD_ID}.json`).json(); console.log(`${Bun.env.IMAGE.split(":")[0]}@${metadataDigest(data)}`)')
          export TEST_IMAGE
          bun run test:images
      - name: Record successful smoke verification
        env:
          BUILD_ID: ${{ matrix.id }}
        run: |
          bun -e 'const path = `.artifacts/results/${Bun.env.BUILD_ID}.json`; const result = await Bun.file(path).json(); await Bun.write(path, JSON.stringify({ ...result, verified: true }, null, 2) + "\n")'
      - name: Report verification result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: echo "Verification job result = $RESULT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.id }}
          path: .artifacts/results/${{ matrix.id }}.json
          include-hidden-files: true
          if-no-files-found: error

  promote:
    # A failed or cancelled build prevents every floating tag from advancing.
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: release-build-plan
          path: .artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          merge-multiple: true
          path: .artifacts/results
      - uses: ./.github/actions/container-engine
        with:
          emulation: 'false'
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Promote verified digests to floating tags
        run: bun run images promote --plan .artifacts/plan.json --results .artifacts/results --output .artifacts/release.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: .artifacts/release.json
          include-hidden-files: true
          if-no-files-found: error
