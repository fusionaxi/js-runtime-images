name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error

  sonarcloud:
    needs: check
    # Repository secrets are unavailable to fork and Dependabot pull requests.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep the scan token on a fresh runner that never executes project scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage
          path: coverage
      - name: Verify coverage report exists
        run: test -s coverage/lcov.info
      - name: Analyze code and coverage with SonarCloud
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          skipSignatureVerification: false
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  plan:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Resolve current stable runtime versions
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan=$(bun src/cli.ts matrix --output .artifacts/plan.json)
          echo "matrix=$plan" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-build-plan
          path: .artifacts/plan.json
          include-hidden-files: true
          if-no-files-found: error

  images:
    name: ${{ matrix.build.id }} (${{ matrix.platform }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.matrix).include }}
        platform: ${{ fromJSON(needs.plan.outputs.matrix).include[0].platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: ci-build-plan
          path: .artifacts
      - uses: ./.github/actions/container-engine
      - name: Build local image
        env:
          BUILD_ID: ${{ matrix.build.id }}
          PLATFORM: ${{ matrix.platform }}
        run: bun run images build --plan .artifacts/plan.json --id "$BUILD_ID" --platform "$PLATFORM"
      - name: Run TypeScript container scenarios
        env:
          TEST_IMAGE: ${{ matrix.build.image }}
          TEST_RUNTIME: ${{ matrix.build.runtime }}
          TEST_VARIANT: ${{ matrix.build.variant }}
          TEST_PLATFORMS: ${{ matrix.platform }}
          EXPECTED_BUN: ${{ matrix.build.bunVersion }}
          EXPECTED_RUNTIME: ${{ matrix.build.runtimeVersion }}
        run: bun run test:images
